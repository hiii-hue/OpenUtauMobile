name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
      build:
        runs-on: macos-26
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup .NET 9
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version: '9.0.x' 

          - name: Install MAUI iOS workload
            run: dotnet workload install maui 
            
          - name: Restore dependencies
            run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net9.0-ios -p:CheckEolWorkLoads=false
            
          - name: Build iOS App
            run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj --no-restore -f net9.0-ios -c Release -r ios-arm64 -p:CheckEolWorkLoads=false -p:VerifyXcodeVersion=false -p:ArchiveOnBuild=true -p:EnableCodeSigning=false
          - name: Package IPA if needed
            run: |
             mkdir -p output
             IPA_FILE=$(find OpenUtauMobile/bin -name "*.app" | head -n 1)
             if [ -n "$IPA_FILE" ] ; then
               cp "$IPA_FILE" output/OpenUtauMobile.ipa
             else
               App_DIR$(find OpenUtauMobile/bin -name "*.app" | head -n 1)
               mkdir -p Payload
               cp -R "$APP_DIR" Payload/
               zip -r output?poenUtauMobile.ipa Payload
               fi

          - name: Upload IPA artifact
            uses: actions/upload-artifact@v4
            with:  
              name: OpenUtauMobile-iOS
              path: output/OpenUtauMobile.ipa
