name: Build iOS

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-ios

      - name: Restore dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net9.0-ios -p:CheckEolWorkloads=false

      - name: Build iOS app
        run: dotnet build OpenUtauMobile/OpenUtauMobile.csproj -c Release -f net9.0-ios -p:CheckEolWorkloads=false --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS
          path: OpenUtauMobile/bin/Release/net9.0-ios/
