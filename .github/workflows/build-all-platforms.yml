name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
      build:
        runs-on: macos-15
        steps:
          - name: Setup .NET 9
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version:  '9.0.x' 

          - name: Install MAUI iOS workload
            run: dotnet workload install maui-ios 
            
          - name: Restore dependencies
            run: dotnet restore OpenUtauMobile/OpenUtaumobile.sln -p:TargetFramework=net9.0-ios

          - name: Publish unsigned IPA
            run: |
               CSPROJ=$(find . -name ''OpenUtaumobile echo ''Found projects: $CSPROJ'' dotnet publish ''$CSPROJ'' -f net9.0-ios -c Debug -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:TargetFrameworks=net9.0-ios -p:EnableCodeSigning=false
          - name: Upload IPA artifact
            uses: actions/upload-artifact@v4
            with:  
              name: OpenUtauMobile-iOS
              path: '**/bin/**/net9.0-ios/ios-arm64/publish/*.ipa'
