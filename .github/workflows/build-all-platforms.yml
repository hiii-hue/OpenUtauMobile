name: Build iOS IPA



on:
  push:
  workflow_dispatch:

permissions:
  contents: read



    jobs:
      build:
        runs-on:macos-15
        steps:
          - name: Setup .NET 9
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version:  '9.0.x' 

          - name: Install MAUI iOS workload
            run: dotnet workload install maui-ios 
            
          - name: Restore dependencies
            run: dotnet restore OpenUtauMobile.csproj -p:TargetFrameworks=net9.0-ios

          - name: Publish unsigned IPA
            run: dotnet publish OpenUtauMobile.csproj -f net9.0-ios -c RElease -r ios-arm64/p:ArchiveOnBuild=true /p:EnableCodeSigning=false

          - name: Upload IPA artifact
            uses: actions/setup-dotnet@v4
        with:
          name: OpenUtauMobile-iOS
          path: '**/bin/Release/net9.0-ios/ios-arm64/publish/*.ipa'
          
