name: Build iOS

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin .NET 9 SDK
        run: dotnet new globaljson --sdk-version 9.0.300 --roll-forward latestFeature --force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Select Xcode and install matching workload
        run: |
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
            dotnet workload install maui-ios --version 9.0.308
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
            dotnet workload install maui-ios --version 9.0.308
          else
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
            dotnet workload install maui-ios --version 9.0.305
          fi
          xcodebuild -version

      - name: Restore dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net9.0-ios -p:CheckEolWorkloads=false

      - name: Build iOS app
        run: dotnet build OpenUtauMobile/OpenUtauMobile.csproj -c Release -f net9.0-ios -p:TargetFrameworks=net9.0-ios -p:CheckEolWorkloads=false --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS
          path: OpenUtauMobile/bin/Release/net9.0-ios/
