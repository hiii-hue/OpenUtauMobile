name: Build iOS

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.3
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26.3*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          fi
          xcodebuild -version

      - name: Pin .NET 9 SDK
        run: dotnet new globaljson --sdk-version 9.0.300 --roll-forward latestFeature --force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET MAUI workload (matched to Xcode 26.3)
        run: dotnet workload install maui-ios --version 9.0.311

      - name: Restore dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks=net9.0-ios -p:CheckEolWorkloads=false

      - name: Build iOS app
        run: dotnet build OpenUtauMobile/OpenUtauMobile.csproj -c Release -f net9.0-ios -p:TargetFrameworks=net9.0-ios -p:CheckEolWorkloads=false --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS
          path: OpenUtauMobile/bin/Release/net9.0-ios/
          
