name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
      build:
        runs-on: macos-26
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup .NET 9
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version: '9.0.x' 

          - name: Pin .NET 9 SDK
            run: dotnet new globaljson --sdk-version 9.0.100 --roll-forward latestFeature --force

          - name: Install MAUI iOS workload
            run: dotnet workload install maui
            
          - name: Build iOS App
            run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-ios -c Release -r ios-arm64 -p:TargetFrameworks=net9.0-ios -p:VerifyXcodeVersion=false -p:ArchiveOnBuild=false -p:EnableCodeSigning=false -p:_RquireCodeSigning=false
          - name: Package IPA if needed
            run: |
             mkdir -p output
               App_DIR$=(find OpenUtauMobile/bin -name "*.app" | head -n 1)
               mkdir -p Payload
               cp -R "$APP_DIR" Payload/
               zip -r output/OpenUtauMobile.ipa Payload

          - name: Upload IPA artifact
            uses: actions/upload-artifact@v4
            with:  
              name: OpenUtauMobile-iOS
              path: output/OpenUtauMobile.ipa
